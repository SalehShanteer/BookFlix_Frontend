<header>
  <div class="d-flex p-2">
    @if (responsiveService.isMobile()) {
      <button class="navbar-toggler" type="button" aria-label="Toggle navigation">
        <i class="bi bi-list"></i>
      </button>
    }
    <app-book-flix-logo class="me-auto"></app-book-flix-logo>
    @for (item of navItems(); track item.id) {
      <div
        class="nav-item-wrapper"
        (mouseenter)="onMenuHover(item.id)"
        (mouseleave)="onMenuHoverOut()"
      >
        <div class="nav-item">
          <span>{{ item.title }}</span>
          <i class="bi bi-chevron-down"></i>
        </div>
        @if (item.children?.length && activeHoveredId() === item.id) {
          <div class="dropdown-menu">
            <span class="dropdown-menu-title">{{ item.menuTitle }}</span>
            @for (child of item.children; track child.id) {
              <span>{{ child.title }}</span>
              <span class="dropdown-menu-item-description">{{ child.description }}</span>
            }
          </div>
        }
      </div>
    }
    <button type="button" class="btn btn-dark btn-sm ms-5" (click)="signOut()">
      {{ 'SignOut' | locale }}
    </button>
  </div>
</header>
