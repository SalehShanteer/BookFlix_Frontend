<div class="root d-flex flex-column flex-shrink-0">
  <button
    class="navbar-toggler"
    type="button"
    (click)="toggleMenu()"
    [attr.aria-expanded]="!isMenuCollapsed()"
    aria-label="Toggle navigation"
  >
    <i class="bi bi-list"></i>
  </button>
  <button
    class="navbar-toggler"
    type="button"
    (click)="closeMenu()"
    [attr.aria-expanded]="!isMenuCollapsed()"
    aria-label="Toggle navigation"
  >
    <i class="bi bi-x"></i>
  </button>
  <app-book-flix-logo></app-book-flix-logo>
  <hr />
  <ul class="nav nav-pills flex-column mb-auto gap-1">
    <li class="nav-item">
      <a
        class="nav-link"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <i class="bi bi-columns-gap"></i>{{ 'Dashboard' | locale }}
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" routerLink="/account-settings" routerLinkActive="active">
        <i class="bi bi-gear"></i>{{ 'AccountSettings' | locale }}
      </a>
    </li>
    <li class="py-2">
      <hr />
    </li>
    <li class="nav-item" (click)="signOut()">
      <a class="nav-link"> <i class="bi bi-box-arrow-right"></i>{{ 'SignOut' | locale }} </a>
    </li>
  </ul>
</div>
