<div class="avatar-wrapper position-relative d-inline-block">
  @if (profileImageUrl()) {
  <img class="img-fluid rounded-circle profile-img" [src]="profileImageUrl()" alt="Profile Image">
  } @else {
  <div class="default-avatar d-flex align-items-center justify-content-center rounded-circle">
    <i class="bi bi-person-fill text-secondary"></i>
  </div>
  }

  <button type="button" class="edit-badge-btn d-flex align-items-center justify-content-center"
    (click)="fileInput.click()" [disabled]="isUploading()" aria-label="Edit Profile Picture"
    title="Edit Profile Picture">
    @if (isUploading()) {
    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
    } @else {
    <i class="bi bi-pencil-fill"></i>
    }
  </button>

  <input #fileInput type="file" accept="image/*" class="d-none" (change)="onFileSelected($event)">
</div>
