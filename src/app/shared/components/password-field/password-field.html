<div class="password-container">
  <input class="form-control" [type]="show ? 'text' : 'password'" [placeholder]="placeholder | locale" [value]="value"
    (input)="updateValue($any($event.target).value)" (blur)="onTouched()" />
  <button type="button" class="toggle-btn" (click)="onToggle()"
    [attr.aria-label]="show ? 'Hide password' : 'Show password'" [title]="show ? 'Hide password' : 'Show password'">
    @if (show) {
    <i class="bi bi-eye-slash"></i>
    } @else {
    <i class="bi bi-eye"></i>
    }
  </button>
</div>
