<div class="dropdown-menu">
  <span class="dropdown-menu-title">{{ item().menuTitle }}</span>
  @for (child of item().children; track child.id) {
    <div class="dropdown-item-grid">
      <i class="bi bi-pencil-fill"></i>
      <span class="dropdown-menu-item-title">{{ child.title }}</span>
      <span class="dropdown-menu-item-description">{{ child.description }}</span>
    </div>
  }
</div>
