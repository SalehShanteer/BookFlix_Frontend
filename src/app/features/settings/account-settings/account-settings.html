<div class="container-fluid p-0">
  <h2 class="text-white">{{ 'AccountSettings' | locale }}</h2>
  <div class="row mb-4">
    <div class="col">
      <div class="section">
        <h4 class="text-white">{{ 'UserOverview' | locale }}</h4>
        <app-profile-image [imageUrl]="profileImageUrl()"></app-profile-image>
      </div>
    </div>
  </div>
  <div class="row g-4">
    <div class="col">
      <div class="section">
        <h4 class="text-white">{{ 'PersonalInformation' | locale }}</h4>
        <img
          [src]=""
          title="User Avatar"
          alt="User Avatar"
          class="avatar-img rounded-circle mb-3"
        />
      </div>
    </div>
    <div class="col">
      <div class="section">
        <h4 class="text-white">{{ 'Security&Password' | locale }}</h4>
      </div>
    </div>
  </div>
</div>
