<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-black">
  <div class="card shadow-lg p-4">
    <div class="text-center mb-4">
      <h3 class="main-text fw-bold">{{ 'WelcomeBack' | locale }}</h3>
      <p class="main-text">{{ 'SignInToAccount' | locale }}</p>
    </div>
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="mb-3">
        <label for="email" class="form-label main-text">{{ 'EmailAddress' | locale }}</label>
        <input id="email" class="form-control" type="email" formControlName="email" placeholder="name@example.com" />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label main-text">{{ 'Password' | locale }}</label>
        <app-password-field id="password" formControlName="password" placeholder="EnterPassword" />
      </div>
      <button type="button" class="btn btn-link p-0" (click)="showRegisterScreen()">
        {{ 'RegisterNow' | locale }}
      </button>
      <button class="btn btn-primary w-100 py-2">
        {{ 'Login' | locale }}
      </button>
    </form>
  </div>
</div>
