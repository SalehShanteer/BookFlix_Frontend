<main class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
  <section class="card shadow-lg p-4">
    <div class="text-center mb-4">
      <h1 class="h3 text-main fw-bold">{{ 'CreateAccount' | locale }}</h1>
      <p class="text-main">{{ 'RegisterCardMessage' | locale }}</p>
    </div>
    <form [formGroup]="registerForm" (ngSubmit)="onSignUp()">
      <div class="mb-3">
        <input id="username" class="form-control" type="text" formControlName="username"
          placeholder="{{ 'EnterUsername' | locale }}" />
        @if (usernameHasError){
        <p class="error-text">{{ usernameError }}</p>
        }
      </div>
      <div class="mb-3">
        <input id="email" class="form-control" type="email" formControlName="email"
          placeholder="{{ 'EnterEmail' | locale }}" />
        @if (emailHasError){
        <p class="error-text">{{ emailError }}</p>
        }
      </div>
      <div class="mb-3">
        <app-password-field id="newPassword" formControlName="newPassword" placeholder="EnterPassword" />
        @if (passwordHasError){
        <p class="error-text">{{ passwordError }}</p>
        }
      </div>
      <div class="mb-3">
        <app-password-field id="confirmPassword" formControlName="confirmPassword" placeholder="ConfirmPassword" />
      </div>
      <button app-action-button type="submit" [isLoading]="isLoading()" aria-label="SignUp">
        {{ 'SignUp' | locale }}
      </button>
      <div class="mt-3 d-flex align-items-center justify-content-center">
        <span class="text-main me-1">{{ 'SignInToAccount' | locale }}</span>
        <a routerLink="/login" class="btn-link p-0">{{ 'SignIn' | locale }}</a>
      </div>
    </form>
  </section>
</main>
