<main class="auth-container">
  <section class="auth-card">
    <header class="auth-header">
      <div class="auth-logo-badge">
        <app-book-flix-logo></app-book-flix-logo>
      </div>
      <h1 class="auth-title">{{ 'CreateAccount' | locale }}</h1>
      <p class="auth-subtitle">{{ 'RegisterCardMessage' | locale }}</p>
    </header>

    <form [formGroup]="registerForm" (ngSubmit)="onSignUp()" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label">{{ 'EnterUsername' | locale }}</label>
        <div class="auth-input-group">
          <i class="bi bi-person input-icon"></i>
          <input
            id="username"
            class="form-control"
            type="text"
            formControlName="username"
            placeholder="{{ 'EnterUsername' | locale }}"
            autocomplete="username"
          />
        </div>
        <app-form-error [control]="registerForm.get('username')"></app-form-error>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">{{ 'EmailAddress' | locale }}</label>
        <div class="auth-input-group">
          <i class="bi bi-envelope input-icon"></i>
          <input
            id="email"
            class="form-control"
            type="email"
            formControlName="email"
            placeholder="{{ 'EnterEmail' | locale }}"
            autocomplete="email"
          />
        </div>
        <app-form-error [control]="registerForm.get('email')"></app-form-error>
      </div>

      <div class="mb-3">
        <label for="newPassword" class="form-label">{{ 'Password' | locale }}</label>
        <app-password-field
          id="newPassword"
          formControlName="newPassword"
          placeholder="EnterPassword"
        />
        <app-form-error [control]="registerForm.get('newPassword')"></app-form-error>
      </div>

      <div class="mb-4">
        <label for="confirmPassword" class="form-label">{{ 'ConfirmPassword' | locale }}</label>
        <app-password-field
          id="confirmPassword"
          formControlName="confirmPassword"
          placeholder="ConfirmPassword"
        />
        <app-form-error [control]="registerForm.get('confirmPassword')"></app-form-error>
        <app-form-error [customError]="serverError()"></app-form-error>
      </div>

      <button
        app-action-button
        type="submit"
        [isLoading]="isLoading()"
        aria-label="SignUp"
      >
        {{ 'SignUp' | locale }}
      </button>

      <footer class="auth-footer">
        <span class="text-muted me-2">{{ 'SignInToAccount' | locale }}</span>
        <a routerLink="/login" class="btn-link fw-semibold">{{ 'SignIn' | locale }}</a>
      </footer>
    </form>
  </section>
</main>
